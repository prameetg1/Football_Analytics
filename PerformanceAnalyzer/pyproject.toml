[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-analyzer"
version = "0.1.0"
description = "Football video analytics — object detection, tracking, homography, and a provider-agnostic analytics layer (xG, VAEP, pitch control, passing networks) with agentic HTML match reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prameet Ghosh", email = "pramitg1@gmail.com" }]
keywords = ["football", "soccer", "analytics", "computer-vision", "xG", "VAEP", "tracking", "statsbomb"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "scipy>=1.12",
    "requests",
    "tqdm",
    "pyyaml",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    "supervision>=0.23,<0.30",
]
teams = [
    "transformers>=4.40",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
]
scrapers = ["soccerdata>=1.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cv: computer-vision pipeline tests",
    "analytics: analytics-layer tests",
    "retrieval: data retrieval tests",
]